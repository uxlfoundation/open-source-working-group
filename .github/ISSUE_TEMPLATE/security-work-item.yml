name: Security improvement work item
description: Track an agreed security improvement, not a vulnerability report.
labels: [security, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Start with the [security improvement guide](https://github.com/uxlfoundation/open-source-working-group/blob/main/security/README.md) for scope and completion evidence.

        Use the affected project's private reporting channel for vulnerabilities. Do not include vulnerability details here.
  - type: input
    id: project
    attributes:
      label: Project repository
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Improvement area
      options:
        - Security onboarding and policy
        - GitHub token permissions
        - Secret scanning
        - Dependency updates
        - CodeQL or static analysis
        - Coverity evaluation
        - CVE-Bin-Tool evaluation
        - OpenSSF Scorecard
        - Fuzzing
    validations:
      required: true
  - type: textarea
    id: baseline
    attributes:
      label: Current state and evidence
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: Proposed change and completion criteria
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Agreed owner
